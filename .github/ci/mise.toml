# Advisory CI tool pins for .github/workflows/ci.yml (loaded via MISE_GLOBAL_CONFIG_FILE).
# Developer workstation tools live at user/global scope (dotfiles-v2), and Python-packaged
# C++/CMake tools (clang-format, cpplint, gersemi) live in pyproject.toml + uv.lock.
# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.13"

[tools]
betterleaks = "1.10.1"
hk = "2.14.0"
jactionlint = "2.6.0"
kingfisher = "2.18.1"
lychee = "0.24.2"
# prettier is an npm tool: mise installs it without node, but it needs node to run.
node = "26.13.1"
# Renovate itself, for its renovate-config-validator (hk step renovate-config). Runs on the node above.
# aube's trust policy refuses @yarnpkg/libzip 3.2.2 (via @yarnpkg/core 4.9.1, which needs ^3.2.2):
# yarnbot published 3.2.0 and 3.2.1 with npm provenance; a maintainer account published 3.2.2
# without it. Its code change from 3.2.1, three parentPath fields in ZipFS.js, is in the source at
# the upstream tag @yarnpkg/libzip/3.2.2 (yarnpkg/berry #6889, the TypeScript 5.9 bump), so that
# one version, and no other, is exempt. The dependency graph is locked under .github/ci/.mise/locks/.
"npm:renovate" = { version = "44.239.1", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
osv-scanner = "2.7.1"
pkl = "0.33.1"
prettier = "3.10.1"
ruff = { version = "0.17.5", minimum_release_age = "0s" }
rumdl = { version = "0.3.4", minimum_release_age = "0s" }
shellcheck = { version = "0.11.0", minimum_release_age = "0s" }
shfmt = { version = "3.14.1", minimum_release_age = "0s" }
tombi = "1.11.2"
ty = { version = "0.0.104", minimum_release_age = "0s" }
typos = "1.52.2"
uv = "0.13.9"
zizmor = "1.32.0"

[settings]
lockfile = true
lockfile_mode = "merge"
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "24h"
