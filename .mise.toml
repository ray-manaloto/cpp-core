# The task runner's configuration for this repository.
#
# The tasks here are the project's verbs. The build lane is parked - there is deliberately no
# build, test or coverage task - so every task below runs without a compiler.
#
# Modular task files organized by category:
# - mise/audit/tasks.toml    - Audit verification (C++26 features audit)
# - mise/hk/tasks.toml       - hk-based checks and utilities
# - mise/ci/tasks.toml       - CI pipeline (parallelized)
# - mise/lint/tasks.toml     - Language-specific linting via hk
# - mise/format/tasks.toml   - Language-specific formatting via hk
# - mise/doctor/tasks.toml   - mise/hk doctor diagnostics
# - mise/setup/tasks.toml    - Tool installation, hooks, validation
# - mise/render/tasks.toml   - Render tasks (placeholder)

#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.11.13"

# Per the 2026-11-24 owner ruling (overturning 2026-11-15), developer tools live at user/global
# scope (dotfiles-v2), Python-packaged C++/CMake tools live in pyproject.toml + uv.lock, and
# advisory CI tool pins live in .github/ci/mise.toml + .github/ci/mise.lock.

[settings]
experimental = true
python.uv_venv_auto = "source"

[deps.uv]
auto = false
run = "uv sync --locked"

[task_config]
includes = [
  "mise/audit/tasks.toml",
  "mise/hk/tasks.toml",
  "mise/ci/tasks.toml",
  "mise/lint/tasks.toml",
  "mise/format/tasks.toml",
  "mise/doctor/tasks.toml",
  "mise/setup/tasks.toml",
  "mise/render/tasks.toml",
  "mise/ship/tasks.toml",
]

[doctor.checks.no-project-tools]
description = "No project-level [tools], no root mise.lock, and slim pyproject.toml (dotfiles-v2)"
run = '''
python3 -I -c 'import glob, os, re, sys
for f in [".mise.toml"] + sorted(glob.glob("mise/**/*.toml", recursive=True)):
    txt = open(f, encoding="utf-8").read()
    if re.search(r"(?m)^\[(?:tools|tool_alias)(?:[.\]])", txt):
        print(f"{f}: declares [tools]"); sys.exit(1)
for bad in ("mise.lock", ".mise/locks", ".tool-versions", "package.json"):
    if os.path.exists(bad):
        print(f"forbidden root file: {bad}"); sys.exit(1)
py = open("pyproject.toml", encoding="utf-8").read()
if not re.search(r"(?m)^package\s*=\s*false\b", py) or not re.search(r"(?m)^dependencies\s*=\s*\[\s*\]", py):
    print("pyproject.toml: require [tool.uv].package = false and empty [project].dependencies"); sys.exit(1)'
'''
hint = "Declare developer tools in global ~/.config/mise/config.toml (dotfiles-v2), CI pins in .github/ci/mise.toml, and Python linters in pyproject.toml [dependency-groups]."
timeout = "5s"

[doctor.checks.hk-pin-match]
description = "hk.pkl pins one hk version consistently and matches global mise hk where set"
run = '''
python3 -I -c 'import os, re, sys
pkl = open("hk.pkl", encoding="utf-8").read()
urls = re.findall(r"releases/download/v([^/]+)/hk@([^#]+)#", pkl)
vs = {v for pair in urls for v in pair}
if len(urls) != 2 or len(vs) != 1 or f"min_hk_version = \"{next(iter(vs))}\"" not in pkl:
    sys.exit(1)
pin = next(iter(vs))
cfg = os.environ.get("MISE_GLOBAL_CONFIG_FILE") or os.path.join(os.environ.get("XDG_CONFIG_HOME") or os.path.expanduser("~/.config"), "mise", "config.toml")
if os.path.exists(cfg):
    txt = open(cfg, encoding="utf-8").read()
    m = re.search(r"(?ms)^\[tools\]\s*(.*?)(?=^\[|\Z)", txt)
    if m:
        hk = re.search(r"(?m)^\s*hk\s*=\s*(?:\"([^\"]+)\"|\{[^}]*version\s*=\s*\"([^\"]+)\")", m.group(1))
        if hk and (hk.group(1) or hk.group(2)) != pin:
            sys.exit(1)'
'''
hint = "Align hk.pkl's two package URLs, min_hk_version, and the global mise hk pin."
timeout = "5s"
