# The task runner's configuration for this repository.
#
# The tasks here are the project's verbs. The build lane is parked - there is deliberately no
# build, test or coverage task - so every task below runs without a compiler.
#
# Modular task files organized by category:
# - mise/audit/tasks.toml    - Audit verification (C++26 features audit)
# - mise/hk/tasks.toml       - hk-based checks and utilities
# - mise/ci/tasks.toml       - CI pipeline (parallelized)
# - mise/lint/tasks.toml     - Language-specific linting via hk
# - mise/format/tasks.toml   - Language-specific formatting via hk
# - mise/doctor/tasks.toml   - mise/hk doctor diagnostics
# - mise/setup/tasks.toml    - Tool installation, hooks, validation
# - mise/render/tasks.toml   - Render tasks (placeholder)

#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.9"

# Every tool an hk step runs on this repository, pinned at its latest version and locked in
# mise.lock, which is the record of what the checks were run with. Renovate (renovate.json) opens
# the update PRs. To bump one by hand, `mise run tools:outdated` shows what is stale; edit the
# version here, then run `mise lock`, `mise run tools:lock-check` and `mise install --locked`
# (never `mise upgrade`).
# Secret scanning is betterleaks (patterns; gitleaks' successor) plus kingfisher (validated
# findings); gitleaks and trufflehog would only duplicate them.
[tools]
betterleaks = "1.10.1"
clang-format = "23.1.5"
hk = "2.12.0"
jactionlint = "2.6.0"
kingfisher = "2.18.1"
lychee = "0.24.2"
# prettier is an npm tool: mise installs it without node, but it needs node to run.
node = "26.13.1"
osv-scanner = "2.7.1"
"pipx:cpplint" = "2.0.2"
pkl = "0.33.0"
prettier = "3.10.1"
# cmakelang (cmake-format) fails on Python 3.15; gersemi replaces it, on 3.14.
"pypi:gersemi" = { version = "0.29.2", python = "3.14.8" }
# cpplint and gersemi install from Python dependency locks, which need a Python interpreter and
# uv >= 0.12.10 from this config, not from the global one. 3.14.8 is the Python gersemi runs on.
python = "3.14.8"
ruff = { version = "0.17.5", minimum_release_age = "0s" }
rumdl = { version = "0.3.4", minimum_release_age = "0s" }
shellcheck = { version = "0.11.0", minimum_release_age = "0s" }
shfmt = { version = "3.14.1", minimum_release_age = "0s" }
tombi = "1.11.2"
ty = { version = "0.0.104", minimum_release_age = "0s" }
typos = "1.52.2"
uv = "0.13.8"
zizmor = "1.32.0"

[settings]
lockfile = true
# The default "merge" mode. The trial "generate" mode makes `mise install` write a macos-arm64
# clang-format entry that names a conda package it has no record for, and `mise install --locked`
# then fails (mise 2026.11.8). `mise run tools:lock-check` catches a lock like that.
lockfile_mode = "merge"

[task_config]
includes = [
  "mise/audit/tasks.toml",
  "mise/hk/tasks.toml",
  "mise/ci/tasks.toml",
  "mise/lint/tasks.toml",
  "mise/format/tasks.toml",
  "mise/doctor/tasks.toml",
  "mise/setup/tasks.toml",
  "mise/render/tasks.toml",
  "mise/ship/tasks.toml",
]
