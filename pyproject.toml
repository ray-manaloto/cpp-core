[project]
name = "cpp-core-lint-tools"
version = "0.0.0"
description = "Pinned Python-packaged C++/CMake lint and format tools for cpp-core"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "clang-format==23.1.5",
  "cpplint==2.0.2",
  "gersemi==0.29.2",
]

[tool.ruff]
target-version = "py311"

[tool.uv]
package = false
