# Setup tasks - install tools, hooks, validate

[hooks_install]
alias = "hooks:install"
description = "Install hk git hooks"
run = "hk install"

[hooks_uninstall]
description = "Uninstall hk git hooks"
run = "hk uninstall"

# Pre-commit and commit-msg via mise
[pre_commit]
alias = "pre-commit"
description = "Run pre-commit checks"
run = "hk run pre-commit"

[commit_msg]
alias = "commit-msg"
description = "Validate commit message"
run = "hk run commit-msg"

# The tools are pinned in .mise.toml and locked in mise.lock; this installs exactly those.
[setup_tools]
description = "Install the pinned tools from mise.lock, then validate hk.pkl"
run = """
mise install --locked
hk validate
"""

# What Renovate would update next, for a bump by hand. It reads only and changes nothing.
[tools_outdated]
alias = "tools:outdated"
description = "List the project's pinned tools that have a newer release"
run = "mise outdated --bump --no-global"

# Read-only: each Dependency Dashboard revision's "Repository Problems" lines, with the time of the
# revision. Shows when a Renovate warning appeared and went away; the Mend log names its branch.
[renovate_problems]
alias = "renovate:problems"
description = "List the Repository Problems in every revision of the Dependency Dashboard (#12)"
run = "python3 scripts/renovate_problems.py"

# Fast and read-only; hk runs it on pre-push and `hk check`.
[tools_lock_check]
alias = "tools:lock-check"
description = "Check that mise.lock has a record for every pin and every conda dependency"
run = "python3 scripts/check_mise_lock.py --self-test"

# Slow: downloads every tool into an empty temporary data directory. Run after a bump.
[tools_lock_verify]
alias = "tools:lock-verify"
description = "Install every tool from mise.lock into an empty data directory"
run = "python3 scripts/check_mise_lock.py --self-test --install"

[setup_all]
description = "Full setup: install tools + install hooks + validate"
run = """
mise run setup_tools
mise run hooks_install
mise run hk_validate
mise run doctor
"""
