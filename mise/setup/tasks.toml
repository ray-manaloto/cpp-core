# Setup tasks - install tools, hooks, validate

[hooks_install]
description = "Install hk git hooks"
run = "hk install"

[hooks_uninstall]
description = "Uninstall hk git hooks"
run = "hk uninstall"

# Pre-commit and commit-msg via mise
[pre_commit]
description = "Run pre-commit checks"
run = "hk run pre-commit"

[commit_msg]
description = "Validate commit message"
run = "hk run commit-msg"

# cpp-core pins no tools: every tool hk runs comes from the user's global mise config, which the
# dotfiles repository manages. This installs what that config lists.
# Never `mise use` here: that writes a pin into this repository's .mise.toml.
[setup_tools]
description = "Install the tools the global mise config lists, then validate hk.pkl"
run = """
mise install
hk validate
"""

[setup_all]
description = "Full setup: install tools + install hooks + validate"
run = """
mise run setup_tools
mise run hooks_install
mise run hk_validate
mise run doctor
"""
