# Setup tasks - install tools, hooks, validate

[hooks_install]
alias = "hooks:install"
description = "Install hk git hooks"
run = "hk install"

[hooks_uninstall]
description = "Uninstall hk git hooks"
run = "hk uninstall"

# Pre-commit and commit-msg via mise
[pre_commit]
alias = "pre-commit"
description = "Run pre-commit checks"
run = "hk run pre-commit"

[commit_msg]
alias = "commit-msg"
description = "Validate commit message"
run = "hk run commit-msg"

# Developer tools come from global dotfiles-v2; Python-packaged C++/CMake tools sync via uv.
[setup_tools]
description = "Sync Python-packaged C++/CMake lint tools from uv.lock, then validate hk.pkl"
run = """
mise deps uv
hk validate --deny-warnings
"""

# What Renovate would update next in .github/ci/mise.toml, for a bump by hand. Read-only.
[tools_outdated]
alias = "tools:outdated"
description = "List advisory CI pins in .github/ci/mise.toml that have a newer release"
run = 'MISE_IGNORED_CONFIG_PATHS="$HOME/.config/mise" MISE_GLOBAL_CONFIG_FILE="$PWD/.github/ci/mise.toml" mise outdated --bump --global'

# Read-only: each Dependency Dashboard revision's "Repository Problems" lines, with the time of the
# revision. Shows when a Renovate warning appeared and went away; the Mend log names its branch.
[renovate_problems]
alias = "renovate:problems"
description = "List the Repository Problems in every revision of the Dependency Dashboard (#12)"
run = "python3 scripts/renovate_problems.py"

# Fast and read-only; hk runs it on pre-push and `hk check`.
[tools_lock_check]
alias = "tools:lock-check"
description = "Check that .github/ci/mise.lock matches .github/ci/mise.toml and uv.lock matches pyproject.toml"
run = "python3 scripts/check_mise_lock.py --self-test && uv lock --check --offline"

# Slow: downloads every advisory CI tool into an empty temporary data directory. Run after a bump.
[tools_lock_verify]
alias = "tools:lock-verify"
description = "Install every advisory CI tool from .github/ci/mise.lock into an empty data directory"
run = "python3 scripts/check_mise_lock.py --self-test --install"

[setup_all]
description = "Full setup: install tools + install hooks + validate"
run = """
mise run setup_tools
mise run hooks_install
mise run hk_validate
mise run doctor
"""
