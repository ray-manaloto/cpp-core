# hk-based checks (already parallelized by hk)

[hk_check]
alias = "hk:check"
description = "Run all hk checks (format + lint)"
run = "hk check --all"

[hk_fix]
alias = "hk:fix"
description = "Auto-fix all hk-checkable files"
run = "hk fix --all"

[hk_check_pre_commit]
description = "Run hk pre-commit checks"
run = "hk run pre-commit"

[hk_check_commit_msg]
description = "Validate commit message format"
run = "hk run commit-msg"

[hk_validate]
alias = "hk:validate"
description = "Validate hk configuration"
sources = ["hk.pkl", ".cpplint", ".rumdl.toml"]
run = "hk validate"

[hk_install]
description = "Install hk git hooks"
run = "hk install"

# hk util shortcuts
[hk_check_merge_conflicts]
description = "Check for merge conflict markers"
run = "hk util check-merge-conflict --all"

[hk_check_case_conflicts]
description = "Check for case-insensitive filename conflicts"
run = "hk util check-case-conflict --all"

[hk_check_large_files]
description = "Check for large files"
run = "hk util check-added-large-files --all"

[hk_check_trailing_whitespace]
description = "Check for trailing whitespace"
run = "hk util trailing-whitespace --all"

[hk_check_newlines]
description = "Check for missing newlines at EOF"
run = "hk util newlines --all"

[hk_check_mixed_line_endings]
description = "Check for mixed line endings"
run = "hk util mixed-line-ending --all"

[hk_fix_smart_quotes]
description = "Fix smart quotes"
run = "hk util fix-smart-quotes --all"

[hk_check_byte_order_marker]
description = "Check for UTF-8 BOM"
run = "hk util check-byte-order-marker --all"

[hk_fix_byte_order_marker]
description = "Fix UTF-8 BOM"
run = "hk util fix-byte-order-marker --all"

[hk_format_diff]
description = "Show format diff for files"
run = "hk util format-diff --all --"

# Runs every fix command on a throwaway copy of HEAD, so a broken `fix` (which `hk validate` and
# `hk check` never execute) fails here instead of in someone's pre-commit.
[hk_fix_smoke]
alias = "hk:fix-smoke"
description = "Run hk fix --all on a scratch worktree of HEAD and show what it would change"
run = """
set -eu
made=$(mktemp -d) || { echo "hk:fix-smoke: mktemp failed" >&2; exit 1; }
dir=$(cd "$made" && pwd -P) || exit 1
repo=$(git rev-parse --show-toplevel)
# Never let the cleanup below point at a real tree: the scratch dir must be a new, empty
# directory under the system temp dir, and not the repository or anything inside it.
case "$dir" in
  "$repo" | "$repo"/*) echo "hk:fix-smoke: refusing scratch path $dir" >&2; exit 1 ;;
esac
case "$dir" in
  /private/var/folders/* | /var/folders/* | /tmp/* | /private/tmp/*) ;;
  *) echo "hk:fix-smoke: scratch path $dir is not under a temp dir" >&2; exit 1 ;;
esac
[ -z "$(ls -A "$dir")" ] || { echo "hk:fix-smoke: scratch dir $dir is not empty" >&2; exit 1; }
trap 'git worktree remove --force "$dir" >/dev/null 2>&1 || true; rm -rf "$dir"' EXIT
git worktree add --quiet --detach "$dir" HEAD
# paranoid mode trusts file by file; trust the whole scratch tree (its resolved path) instead.
export MISE_TRUSTED_CONFIG_PATHS="$dir"
(cd "$dir" && hk fix --all --skip-step check-clean-workspace)
git -C "$dir" status --short
"""

[docs_commands]
alias = "docs:commands"
description = "Check that every `mise run <task>` in the docs and scripts names a real task"
run = "python3 scripts/check_doc_commands.py --self-test"
