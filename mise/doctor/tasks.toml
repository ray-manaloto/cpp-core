# mise doctor integration

[doctor]
description = "Run mise doctor checks (project + env)"
run = "mise doctor && mise doctor project"

[doctor_full]
description = "Run all mise doctor checks including project diagnostics"
run = "mise doctor && mise doctor project --verbose"

# hk doctor (via mise)
[hk_doctor]
description = "Validate hk.pkl and list the steps hk check would run (hk has no doctor command)"
run = "hk validate && hk check --all --plan"

# Project diagnostics via mise doctor
[diag_project]
description = "Run mise doctor project diagnostics"
run = "mise doctor project"

[diag_env]
description = "Run mise doctor environment diagnostics"
run = "mise doctor"

[diag_all]
description = "Run all mise doctor diagnostics"
run = "mise doctor && mise doctor project"

# Check for dirty git workspace (uncommitted changes)
[check_clean_workspace]
description = "Check for uncommitted changes in git workspace"
run = """
if [ -n "$(git status --porcelain)" ]; then
  echo "ERROR: Dirty git workspace detected:"
  git status --short
  exit 1
fi
echo "Git workspace is clean"
"""
