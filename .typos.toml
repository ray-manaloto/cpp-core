#:tombi schema.strict = false
# typos configuration for cpp-core
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
  "docs/**",
  "ports/**",
  "upstream/**",
  "repro/**",
  ".github/ci/.mise/**",
  ".github/ci/mise.lock",
  ".opencode/**",
  "build/**",
  "uv.lock",
]

[default]
extend-ignore-re = ["`[0-9a-f]{7,40}`"]

